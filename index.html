<meta name="theme-color" content="#050505">
<meta name="description" content="Tes chiffres, vérifiés directement auprès du casino avec TLSNotary.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root {
  --bg: #050505; --card: #151515; --card-deep: #0c0c0c; --fill: #1c1c1c; --masked: #222222;
  --line: #ffffff12; --line-strong: #ffffff29;
  --ink: #f5f5f5; --ink-muted: #a3a3a3; --ink-faint: #8a8a8a;
  --lime: #6ee600; --lime-soft: #6ee6001a; --on-lime: #050505;
  --amber: #f2b84b; --amber-soft: #f2b84b1a; --red: #ff6b5b; --red-soft: #ff6b5b1a;
  --overlay: #000000b8; --focus: var(--lime);
  --card-edge: inset 0 1px 0 #ffffff0d;
  --panel: 0 32px 80px #000000e6, 0 0 0 1px #ffffff12;
  --glow-lime: 0 0 0 4px #6ee6001f, 0 0 28px #6ee60052;
  --focus-ring: 0 0 0 2px #050505, 0 0 0 4px #6ee600;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px;
  --space-8: 32px; --space-10: 40px; --space-12: 48px; --space-16: 64px;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px; --radius-xl: 24px; --radius-full: 999px;
  --topbar-h: 64px; --aside-w: 380px; --page-max: 1320px; --control-h: 44px; --control-lg-h: 60px;
  --node: 64px; --panel-w: 720px;
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-text); font-size: 15px; line-height: 22px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
[hidden] { display: none !important; }
.np-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.np-icon { flex: none; display: block; }
.np-num, .np-figure__value, .np-compare__num, .np-progress__clock, .np-steps__meter-value { font-variant-numeric: tabular-nums; }
:where(.np-btn, .np-tabs__tab, .np-sheet__close, .np-compare__scroll, .np-raw, .np-journal):focus-visible { outline: none; box-shadow: var(--focus-ring); }

/* Button */
.np-btn { -webkit-appearance: none; appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: var(--control-h); padding: 0 var(--space-5); border-radius: var(--radius-full); border: 1px solid transparent; font-family: var(--font-display); font-size: 15px; line-height: 20px; font-weight: 600; letter-spacing: -0.005em; text-decoration: none; white-space: nowrap; cursor: pointer; transition: background-color .16s ease, border-color .16s ease, box-shadow .2s ease, transform .16s ease, color .16s ease; }
.np-btn:active { transform: translateY(1px); }
.np-btn--primary { background: var(--lime); color: var(--on-lime); }
.np-btn--primary:hover { box-shadow: var(--glow-lime); }
.np-btn--primary:focus-visible { box-shadow: var(--focus-ring); }
.np-btn--secondary { background: var(--fill); border-color: var(--line-strong); color: var(--ink); }
.np-btn--secondary:hover { border-color: var(--ink-faint); }
.np-btn--ghost { background: transparent; color: var(--ink-muted); padding: 0 var(--space-3); }
.np-btn--ghost:hover { color: var(--ink); background: var(--fill); }
.np-btn--lg { height: var(--control-lg-h); padding: 0 var(--space-8); font-size: 18px; line-height: 24px; gap: var(--space-3); }
.np-btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
.np-btn__after { transition: transform .2s ease; }
.np-btn:hover .np-btn__after { transform: translateX(3px); }

/* Card */
.np-card { position: relative; background: linear-gradient(180deg, var(--card) 0%, var(--card-deep) 100%); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--card-edge); padding: var(--space-6); min-width: 0; }
.np-card__head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-5); }
.np-card__title { margin: 0; font-family: var(--font-display); font-size: 18px; line-height: 24px; font-weight: 600; letter-spacing: -0.005em; color: var(--ink); }

/* TopBar */
.np-topbar { flex: none; height: var(--topbar-h); display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: 0 var(--space-6); border-bottom: 1px solid var(--line); box-sizing: border-box; }
.np-topbar__brand { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
.np-topbar__logo { width: 28px; height: 28px; object-fit: contain; display: block; }
.np-topbar__name { font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 24px; letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; }
.np-topbar__ctx { font-size: 13px; line-height: 18px; color: var(--ink-faint); padding-left: var(--space-3); border-left: 1px solid var(--line-strong); white-space: nowrap; }
.np-topbar__right { display: flex; align-items: center; gap: var(--space-2); }

/* ProofPath */
.np-path { --np-node: var(--node); display: flex; align-items: flex-start; justify-content: center; width: 100%; }
.np-path--sm { --np-node: 44px; }
.np-path__node { flex: none; width: 150px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.np-path--sm .np-path__node { width: 92px; }
.np-path__dot { position: relative; width: var(--np-node); height: var(--np-node); border-radius: var(--radius-full); display: grid; place-items: center; background: var(--card-deep); border: 1px solid var(--line-strong); color: var(--ink-faint); transition: color .4s ease, border-color .4s ease, box-shadow .5s ease, background-color .4s ease; }
.np-path__label { margin-top: var(--space-3); font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 20px; color: var(--ink-muted); transition: color .4s ease; }
.np-path__sub { margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--ink-faint); }
.np-path--sm .np-path__label { margin-top: var(--space-2); font-size: 13px; line-height: 18px; }
.np-path--sm .np-path__sub { font-size: 11px; }
.np-path__node.is-on .np-path__dot { color: var(--lime); border-color: var(--lime); }
.np-path__node.is-on .np-path__label, .np-path__node.is-active .np-path__label { color: var(--ink); }
.np-path__node.is-active .np-path__dot { color: var(--lime); border-color: var(--lime); box-shadow: var(--glow-lime); }
.np-path__node.is-active .np-path__dot::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; border: 1px solid var(--lime); animation: np-ring 1.6s ease-out infinite; }
.np-path__node.is-error .np-path__dot { color: var(--red); border-color: var(--red); }
.np-path__node.is-error .np-path__label { color: var(--red); }
.np-path__badge { position: absolute; right: -2px; bottom: -2px; width: 20px; height: 20px; border-radius: var(--radius-full); background: var(--lime); color: var(--on-lime); display: grid; place-items: center; box-shadow: 0 0 0 3px var(--bg); animation: np-pop .35s cubic-bezier(.2,.9,.3,1.3) both; }
.np-path--sm .np-path__badge { width: 16px; height: 16px; right: -3px; bottom: -3px; }
.np-path__link { position: relative; flex: 1 1 auto; min-width: 12px; height: 2px; margin-top: calc(var(--np-node) / 2 - 1px); background: var(--line-strong); border-radius: var(--radius-full); overflow: hidden; }
.np-path__link.is-on { background: var(--lime); overflow: visible; }
.np-path__link.is-active { background: repeating-linear-gradient(90deg, var(--lime) 0 8px, transparent 8px 14px); background-size: 28px 2px; animation: np-charge .6s linear infinite; }
.np-path__link.is-error { background: repeating-linear-gradient(90deg, var(--red) 0 4px, transparent 4px 9px); }
.np-path__flow { display: none; }
.np-path--done .np-path__link.is-on .np-path__flow { display: block; position: absolute; top: -2px; left: 0; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--ink); box-shadow: 0 0 10px var(--lime); animation: np-flow 2.4s cubic-bezier(.45,0,.55,1) 1.2s infinite; }
.np-path--done .np-path__link.is-on + .np-path__node + .np-path__link .np-path__flow { animation-delay: 0s; }
.np-path--idle .np-path__node:nth-child(3) .np-path__dot { color: var(--ink-muted); }

/* StepList */
.np-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.np-steps__item { position: relative; display: flex; gap: var(--space-3); padding: 9px 0; }
.np-steps__item:not(:last-child)::before { content: ""; position: absolute; left: 11.5px; top: 37px; bottom: -7px; width: 1px; background: var(--line-strong); }
.np-steps__item.is-done:not(:last-child)::before { background: var(--lime); opacity: .45; }
.np-steps__mark { flex: none; width: 24px; height: 24px; border-radius: var(--radius-full); display: grid; place-items: center; font-family: var(--font-display); font-size: 12px; font-weight: 600; color: var(--ink-faint); border: 1px solid var(--line-strong); box-sizing: border-box; font-variant-numeric: tabular-nums; }
.np-steps__item.is-done .np-steps__mark { background: var(--lime); border-color: var(--lime); color: var(--on-lime); }
.np-steps__item.is-failed .np-steps__mark { background: var(--red); border-color: var(--red); color: var(--bg); }
.np-steps__item.is-active .np-steps__mark { border-color: transparent; }
.np-steps__spin { width: 24px; height: 24px; border-radius: var(--radius-full); border: 2px solid var(--line-strong); border-top-color: var(--lime); box-sizing: border-box; animation: np-spin .9s linear infinite; }
.np-steps__body { min-width: 0; flex: 1; padding-top: 2px; }
.np-steps__title { font-size: 15px; line-height: 20px; color: var(--ink-faint); }
.np-steps__item.is-done .np-steps__title { color: var(--ink-muted); }
.np-steps__item.is-active .np-steps__title { color: var(--ink); font-weight: 600; }
.np-steps__item.is-failed .np-steps__title { color: var(--red); font-weight: 600; }
.np-steps__detail { margin-top: var(--space-1); font-size: 13px; line-height: 18px; color: var(--ink-muted); animation: np-in .35s ease both; }
.np-steps__meter { margin-top: var(--space-3); display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.np-steps__meter-track { flex: 1 1 140px; height: 4px; border-radius: var(--radius-full); background: var(--fill); overflow: hidden; }
.np-steps__meter-bar { height: 100%; border-radius: inherit; background: var(--lime); transition: width .25s linear; }
.np-steps__meter-value { font-family: var(--font-display); font-size: 20px; line-height: 24px; font-weight: 500; letter-spacing: -0.01em; color: var(--ink); min-width: 7ch; text-align: right; }
.np-steps__meter-cap { flex-basis: 100%; font-size: 12px; line-height: 16px; color: var(--ink-faint); }

/* Progress */
.np-progress__row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-2); }
.np-progress__label { font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.np-progress__clock { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-size: 20px; line-height: 24px; font-weight: 500; color: var(--ink); }
.np-progress__clock .np-icon { color: var(--ink-faint); }
.np-progress__track { height: 6px; border-radius: var(--radius-full); background: var(--fill); overflow: hidden; }
.np-progress__bar { height: 100%; border-radius: inherit; background: var(--lime); box-shadow: 0 0 12px var(--lime); }

/* Verdict */
.np-verdict { display: flex; align-items: flex-start; gap: var(--space-4); animation: np-in .45s ease both; }
.np-verdict__icon { flex: none; width: 52px; height: 52px; border-radius: var(--radius-full); display: grid; place-items: center; background: var(--lime-soft); color: var(--lime); }
.np-verdict--gap .np-verdict__icon { background: var(--amber-soft); color: var(--amber); }
.np-verdict--refused .np-verdict__icon { background: var(--red-soft); color: var(--red); }
.np-verdict__body { min-width: 0; padding-top: 6px; }
.np-verdict__title { margin: 0; font-family: var(--font-display); font-size: 30px; line-height: 36px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); text-wrap: balance; }
.np-verdict__meta { margin-top: var(--space-3); display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4); }
.np-verdict__server { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 var(--space-3); border-radius: var(--radius-full); background: var(--fill); border: 1px solid var(--line); font-size: 13px; line-height: 18px; }
.np-verdict__server .np-icon { color: var(--lime); }
.np-verdict__server-k { color: var(--ink-faint); }
.np-verdict__server-v { color: var(--ink); font-family: var(--font-mono); font-size: 12px; }
.np-verdict__text { font-size: 13px; line-height: 18px; color: var(--ink-muted); }

/* KeyFigure */
.np-figures { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-4); }
.np-figure { min-width: 0; padding: var(--space-4); border-radius: var(--radius-md); background: var(--card-deep); border: 1px solid var(--line); }
.np-figure__label { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); }
.np-figure__value { margin-top: var(--space-2); font-family: var(--font-display); font-size: 34px; line-height: 38px; font-weight: 500; letter-spacing: -0.02em; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-figure__hint { margin-top: var(--space-1); font-size: 12px; line-height: 16px; color: var(--ink-faint); }

/* StatusPill */
.np-pill { display: inline-flex; align-items: center; gap: var(--space-1); height: 24px; padding: 0 10px 0 8px; border-radius: var(--radius-full); font-size: 12.5px; line-height: 16px; font-weight: 600; white-space: nowrap; }
.np-pill--same { background: var(--lime-soft); color: var(--lime); }
.np-pill--gap { background: var(--amber-soft); color: var(--amber); }
.np-pill--refused { background: var(--red-soft); color: var(--red); }
.np-pill--pending { background: var(--fill); color: var(--ink-muted); }

/* ComparisonTable */
.np-compare { display: flex; flex-direction: column; min-height: 0; }
.np-compare__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-3); }
.np-compare__title { margin: 0; font-family: var(--font-display); font-size: 18px; line-height: 24px; font-weight: 600; letter-spacing: -0.005em; }
.np-compare__count { font-size: 13px; line-height: 18px; color: var(--ink-faint); white-space: nowrap; }
.np-compare__scroll { flex: 1 1 auto; min-height: 150px; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--card-deep); scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.np-compare__table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 18px; }
.np-compare__table thead th { position: sticky; top: 0; z-index: 1; background: var(--card-deep); text-align: left; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); padding: var(--space-3) var(--space-4); box-shadow: inset 0 -1px 0 var(--line); }
.np-compare__table tbody tr { border-top: 1px solid var(--line); }
.np-compare__table tbody tr:first-child { border-top: 0; }
.np-compare__table tbody tr:hover { background: var(--fill); }
.np-compare__table td, .np-compare__table tbody th { padding: 10px var(--space-4); vertical-align: top; }
.np-compare__player { text-align: left; font-weight: 500; color: var(--ink); white-space: nowrap; }
.np-compare__mark { display: none; }
.np-compare__table tbody .np-compare__player { width: 100%; max-width: 0; cursor: pointer; }
.np-compare__name { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: top; }
.np-compare__player.is-open { white-space: normal; }
.np-compare__player.is-open .np-compare__name { white-space: normal; overflow-wrap: anywhere; }
.vs-dock { display: none; }
.vs-short { display: none; }
.np-compare__table .np-compare__num { text-align: right; color: var(--ink); white-space: nowrap; width: 1%; padding-left: var(--space-8); }
.np-compare__num > span { display: block; }
.np-compare__dash { margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--amber); }
.np-compare__table .np-compare__st { text-align: right; width: 1%; white-space: nowrap; }
.np-compare__foot { margin-top: var(--space-3); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-2) var(--space-4); }
.np-compare__summary { display: inline-flex; align-items: center; gap: var(--space-2); font-size: 13px; line-height: 18px; color: var(--ink); }
.np-compare__summary.is-same .np-icon { color: var(--lime); }
.np-compare__summary.is-gap .np-icon { color: var(--amber); }
.np-compare__updated { font-size: 12px; line-height: 16px; color: var(--ink-faint); }

/* Guarantee */
.np-guarantee { display: flex; gap: var(--space-3); align-items: flex-start; }
.np-guarantee__icon { flex: none; width: 36px; height: 36px; border-radius: var(--radius-full); display: grid; place-items: center; background: var(--fill); border: 1px solid var(--line); color: var(--lime); }
.np-guarantee__title { font-size: 15px; line-height: 20px; font-weight: 600; color: var(--ink); padding-top: 1px; }
.np-guarantee__text { margin-top: 2px; font-size: 13px; line-height: 18px; color: var(--ink-muted); }

/* RawProof */
.np-raw { overflow: auto; padding: var(--space-3) 0; border-radius: var(--radius-md); background: var(--card-deep); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 13px; line-height: 20px; color: var(--ink-muted); counter-reset: np-line; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.np-raw__line { display: flex; align-items: center; min-height: 20px; padding-right: var(--space-4); white-space: pre; counter-increment: np-line; }
.np-raw__gut { flex: none; width: 44px; padding-right: var(--space-3); box-sizing: border-box; text-align: right; color: var(--ink-faint); font-size: 11px; position: relative; user-select: none; }
.np-raw__gut::before { content: counter(np-line); }
.np-raw__line.is-mine .np-raw__gut::after { content: ""; position: absolute; left: 8px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: var(--radius-full); background: var(--lime); }
.np-raw__line.is-mine code { color: var(--ink); }
.np-raw__line code { font: inherit; }
.np-raw__k { color: var(--ink-muted); }
.np-raw__line.is-mine .np-raw__s, .np-raw__line.is-mine .np-raw__n { color: var(--ink); }
.np-raw__s, .np-raw__n { color: var(--ink-muted); }
.np-raw__line.is-masked { padding-top: 3px; padding-bottom: 3px; }
.np-raw__mask { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 var(--space-3); border-radius: var(--radius-sm); background: repeating-linear-gradient(135deg, var(--masked) 0 6px, var(--fill) 6px 12px); color: var(--ink-faint); font-family: var(--font-text); font-size: 12px; line-height: 16px; font-weight: 500; }

/* FactList */
.np-facts { margin: 0; display: grid; grid-template-columns: max-content 1fr; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--card-deep); overflow: hidden; }
.np-facts__row { display: contents; }
.np-facts dt, .np-facts dd { margin: 0; padding: 10px var(--space-4); font-size: 13px; line-height: 18px; border-top: 1px solid var(--line); }
.np-facts__row:first-child dt, .np-facts__row:first-child dd { border-top: 0; }
.np-facts dt { color: var(--ink-faint); white-space: nowrap; }
.np-facts dd { color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.np-facts dd.is-mono { font-family: var(--font-mono); font-size: 12px; }

/* Journal */
.np-journal { list-style: none; margin: 0; padding: var(--space-3) var(--space-4); overflow: auto; border-radius: var(--radius-md); background: var(--card-deep); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; line-height: 18px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.np-journal li { display: grid; grid-template-columns: max-content 16px 1fr; gap: var(--space-3); align-items: start; padding: 3px 0; }
.np-journal time { color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.np-journal__mark { display: grid; place-items: center; height: 18px; color: var(--ink-faint); }
.np-journal .is-ok .np-journal__mark { color: var(--lime); }
.np-journal .is-error .np-journal__mark { color: var(--red); }
.np-journal__dot { width: 4px; height: 4px; border-radius: var(--radius-full); background: var(--ink-faint); }
.np-journal__text { color: var(--ink-muted); }
.np-journal .is-ok .np-journal__text { color: var(--ink); }
.np-journal .is-error .np-journal__text { color: var(--red); }

/* Tabs */
.np-tabs { display: flex; gap: var(--space-6); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.np-tabs__tab { -webkit-appearance: none; appearance: none; position: relative; background: none; border: 0; padding: var(--space-3) 0 14px; margin: 0; font-family: var(--font-display); font-size: 15px; line-height: 20px; font-weight: 600; color: var(--ink-muted); cursor: pointer; white-space: nowrap; border-radius: var(--radius-sm); transition: color .16s ease; }
.np-tabs__tab:hover { color: var(--ink); }
.np-tabs__tab.is-active { color: var(--ink); }
.np-tabs__tab.is-active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--lime); }

/* Sheet */
.np-sheet { position: fixed; inset: 0; z-index: 50; display: flex; justify-content: flex-end; }
.np-sheet__scrim { position: absolute; inset: 0; background: var(--overlay); animation: np-fade .25s ease both; }
.np-sheet__panel { outline: none; position: relative; margin: var(--space-3); width: min(var(--panel-w), calc(100% - 24px)); display: flex; flex-direction: column; min-height: 0; background: linear-gradient(180deg, var(--card) 0%, var(--card-deep) 100%); border-radius: var(--radius-xl); box-shadow: var(--panel); animation: np-slide .32s cubic-bezier(.2,.8,.2,1) both; }
.np-sheet__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); padding: var(--space-6) var(--space-6) var(--space-4); }
.np-sheet__title { margin: 0; font-family: var(--font-display); font-size: 24px; line-height: 30px; font-weight: 600; letter-spacing: -0.015em; }
.np-sheet__sub { margin: var(--space-1) 0 0; font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.np-sheet__close { -webkit-appearance: none; appearance: none; flex: none; width: 40px; height: 40px; border-radius: var(--radius-full); border: 1px solid var(--line-strong); background: var(--fill); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.np-sheet__close:hover { border-color: var(--ink-faint); }
.np-sheet__body { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 0 var(--space-6) var(--space-6); }

/* StateMessage */
.np-state { display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 480px; margin: 0 auto; padding: var(--space-8) var(--space-4); animation: np-in .45s ease both; }
.np-state__icon { width: 64px; height: 64px; border-radius: var(--radius-full); display: grid; place-items: center; background: var(--fill); border: 1px solid var(--line); color: var(--ink-muted); }
.np-state--refused .np-state__icon { background: var(--red-soft); border-color: transparent; color: var(--red); }
.np-state__title { margin: var(--space-5) 0 0; font-family: var(--font-display); font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
.np-state--refused .np-state__title { color: var(--red); }
.np-state__text { margin-top: var(--space-3); font-size: 15px; line-height: 22px; color: var(--ink-muted); text-wrap: pretty; }
.np-state__text strong { color: var(--ink); font-weight: 600; }
.np-state__action { margin-top: var(--space-6); display: flex; flex-wrap: wrap; gap: var(--space-2); justify-content: center; }

/* Note (reassurance under the comparison) */
.np-note { margin-top: var(--space-3); display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--amber-soft); border: 1px solid #f2b84b33; font-size: 13px; line-height: 19px; color: var(--ink-muted); }
.np-note .np-icon { color: var(--amber); margin-top: 1px; }
.np-note b { color: var(--ink); font-weight: 600; }

/* Toast */
.np-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 13px; padding: 9px 16px; border-radius: var(--radius-full); }

/* Motion */
@keyframes np-spin { to { transform: rotate(360deg); } }
@keyframes np-ring { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.45); } }
@keyframes np-charge { to { background-position: 28px 0; } }
@keyframes np-flow { 0% { left: calc(100% - 6px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { left: 0; opacity: 0; } }
@keyframes np-pop { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes np-in { from { opacity: .35; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes np-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes np-slide { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes np-rise { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: none; } }

/* Page */
html, body { height: 100%; }
body { overflow: hidden; }
.vs { height: 100%; display: flex; flex-direction: column; }
.vs-main { flex: 1 1 0; min-height: 0; width: 100%; max-width: var(--page-max); margin: 0 auto; box-sizing: border-box; padding: var(--space-6) var(--space-8); display: flex; flex-direction: column; }
.vs-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; animation: np-in .45s ease both; }
.vs-title { margin: 0; max-width: 820px; font-family: var(--font-display); font-size: 44px; line-height: 48px; font-weight: 600; letter-spacing: -0.025em; text-wrap: balance; }
.vs-title--run { font-size: 34px; line-height: 40px; }
.vs-lead { margin: var(--space-4) 0 0; max-width: 600px; font-size: 17px; line-height: 26px; color: var(--ink-muted); text-wrap: pretty; }
.vs-path { width: 100%; max-width: 720px; margin-top: var(--space-10); }
.vs-cta { margin-top: var(--space-12); }
.vs-trust { margin-top: var(--space-4); display: flex; gap: var(--space-4); justify-content: center; flex-wrap: wrap; font-size: 13px; line-height: 18px; color: var(--ink-faint); }
.vs-trust span, .vs-trust a { display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; }
.vs-trust a:hover { color: var(--ink); }
.vs-trust .np-icon { color: var(--ink-muted); }
.vs-run { width: 100%; max-width: 640px; margin-top: var(--space-8); text-align: left; }
.vs-run .np-progress { margin-bottom: var(--space-4); }
.vs-result { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) var(--aside-w); gap: var(--space-6); animation: np-in .45s ease both; }
.vs-zone { display: flex; flex-direction: column; min-height: 0; }
.vs-zone > .np-figures { margin: var(--space-6) 0; }
.vs-zone > .np-compare { flex: 1; }
.vs-aside { display: flex; flex-direction: column; gap: var(--space-5); }
.vs-aside .np-card__head { margin-bottom: 0; }
.vs-aside .np-path { padding: var(--space-2) 0; }
.vs-guarantees { display: flex; flex-direction: column; gap: var(--space-4); }
.vs-actions { margin-top: auto; display: flex; flex-direction: column; gap: var(--space-2); }
.vs-actions .np-btn { width: 100%; }
.vs-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.vs-state .np-path { max-width: 520px; margin-bottom: var(--space-4); }
.vs-h3 { margin: var(--space-6) 0 var(--space-3); font-family: var(--font-display); font-size: 15px; line-height: 20px; font-weight: 600; }
.vs-hint { margin: var(--space-3) 0 0; font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.vs-tools { margin-top: var(--space-4); display: flex; flex-wrap: wrap; gap: var(--space-2); }
.vs-prose { max-width: 600px; margin-top: var(--space-6); }
.vs-prose p { margin: 0 0 var(--space-4); font-size: 15px; line-height: 22px; color: var(--ink-muted); }
.vs-prose p strong { color: var(--ink); font-weight: 600; }
.vs-prose h3 { margin: var(--space-6) 0 var(--space-2); font-family: var(--font-display); font-size: 17px; line-height: 24px; font-weight: 600; color: var(--ink); }

@media (max-width: 720px) {
  body { overflow: auto; }
  body.is-sheet-open { overflow: hidden; }
  .vs { height: auto; min-height: 100%; }
  .vs-main { flex: none; padding: var(--space-5) var(--space-4) var(--space-12); }
  .vs-center { justify-content: flex-start; padding-top: var(--space-6); }
  .vs-title { font-size: 32px; line-height: 36px; }
  .vs-title--run { font-size: 28px; line-height: 34px; }
  .vs-lead { font-size: 15px; line-height: 22px; }
  .vs-path { margin-top: var(--space-8); }
  .vs-cta { margin-top: var(--space-8); width: 100%; }
  .vs-cta .np-btn { width: 100%; }
  .vs-result { grid-template-columns: 1fr; }
  .vs-zone > .np-compare .np-compare__scroll { max-height: 420px; }
  .vs-actions { margin-top: var(--space-2); }
  .np-topbar .np-btn span, .np-topbar .np-btn .np-btn__after { display: none; }
  .np-topbar__ctx { display: none; }
  .np-figures { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); }
  .np-figure__value { font-size: 26px; line-height: 30px; }
  .np-verdict { flex-direction: column; gap: var(--space-3); }
  .np-verdict__icon { width: 44px; height: 44px; }
  .np-verdict__body { padding-top: 0; }
  .np-verdict__title { font-size: 24px; line-height: 30px; }
  .np-compare__table td, .np-compare__table tbody th, .np-compare__table thead th { padding-left: var(--space-3); padding-right: var(--space-3); }
  .np-compare__table .np-compare__num { padding-left: var(--space-3); white-space: normal; }
  .np-compare__num > span:first-child { white-space: nowrap; }
  .np-compare .np-pill { width: 24px; padding: 0; justify-content: center; }
  .np-compare .np-pill__word { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .np-compare__table thead .np-compare__st { font-size: 0; }
  .np-card { padding: var(--space-5); }
  .np-topbar { padding: 0 var(--space-4); }
  .np-path__node { width: 96px; }
  .np-path { --np-node: 52px; }
  .np-path--sm { --np-node: 40px; }
  body:has(.vs-dock:not(:empty)) .vs-main { padding-bottom: calc(var(--space-12) + 64px + env(safe-area-inset-bottom)); }
  .vs-result > .np-card { padding: var(--space-4); }
  .vs-result .np-figures { gap: var(--space-2); }
  .vs-result .np-figure { padding: var(--space-3) var(--space-4); }
  .np-compare__table .np-compare__st { display: none; }
  .np-compare__mark { display: inline-flex; vertical-align: -6px; margin-right: var(--space-2); }
  .np-compare__name { max-width: calc(100% - 32px); }
  .np-compare__scroll { overflow-x: hidden; }
  .np-compare__table .np-compare__num { padding-left: var(--space-2); }
  .np-compare__table td:last-of-type, .np-compare__table thead th:last-of-type { padding-right: var(--space-3); }
  .vs-aside .vs-actions .np-btn:first-child { display: none; }
  .vs-dock:not(:empty) { display: block; position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; padding: var(--space-4) var(--space-4) calc(var(--space-4) + env(safe-area-inset-bottom)); background: linear-gradient(180deg, transparent 0%, var(--bg) 40%); }
  .vs-dock .np-btn { width: 100%; }
  .vs-long { display: none; }
  .vs-short { display: inline; }
  .vs-tools { flex-direction: column; }
  .vs-tools .np-btn { width: 100%; }
  .np-path__node, .np-path--sm .np-path__node { width: auto; flex: 0 1 auto; min-width: 72px; max-width: 100px; }
  .np-path__sub, .np-path--sm .np-path__sub { white-space: nowrap; font-size: 10.5px; }
  .np-path__link { min-width: 28px; }
  .np-sheet { align-items: flex-end; }
  .np-sheet__panel { margin: 0; width: 100%; max-height: 92vh; max-height: 92dvh; border-radius: var(--radius-xl) var(--radius-xl) 0 0; animation-name: np-rise; }
  .np-sheet__head, .np-sheet__body { padding-left: var(--space-5); padding-right: var(--space-5); }
  .np-facts { grid-template-columns: 1fr; }
  .np-facts dd { border-top: 0; padding-top: 0; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .np-path__flow, .np-path__node.is-active .np-path__dot::after { display: none !important; }
  .np-steps__spin { border-color: var(--lime); border-top-color: var(--lime); }
  .np-path__link.is-active { background: var(--lime); opacity: .55; }
}
</style>
</head>
<body>
<div class="vs">
  <header class="np-topbar">
    <div class="np-topbar__brand">
      <img class="np-topbar__logo" src="./logo.png" alt="" width="28" height="28">
      <span class="np-topbar__name">Network Partners</span>
      <span class="np-topbar__ctx">Vérification</span>
    </div>
    <div class="np-topbar__right">
      <a class="np-btn np-btn--ghost" href="https://github.com/NetworkPartners/verification-tlsnotary" target="_blank" rel="noopener noreferrer"><svg class="np-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5M13.5 5l-3 14"/></svg><span>Code public sur GitHub</span></a>
    </div>
  </header>
  <main class="vs-main" id="main"></main>
</div>

<div class="np-sheet" id="sheet" hidden>
  <div class="np-sheet__scrim" id="sheetScrim"></div>
  <section class="np-sheet__panel" id="sheetPanel" tabindex="-1" role="dialog" aria-modal="true" aria-label="La preuve">
    <header class="np-sheet__head">
      <div><h2 class="np-sheet__title">La preuve</h2><p class="np-sheet__sub" id="sheetSub"></p></div>
      <button type="button" class="np-sheet__close" id="sheetClose" aria-label="Fermer"><svg class="np-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
    </header>
    <div class="np-sheet__body"><div class="np-tabs" role="tablist" id="sheetTabs"></div><div id="sheetBody"></div></div>
  </section>
</div>
<div class="vs-dock" id="dock"></div>
<div class="np-toast" id="toast" hidden></div>
<script type="module" src="./main.js"></script>
</body>
</html>
